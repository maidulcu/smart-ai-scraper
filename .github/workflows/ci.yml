name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      # Skips the optional transformers/torch extra; tests don't need browsers or models
      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: flake8 smart_ai_scraper tests setup.py

      - name: Test
        run: pytest -v
